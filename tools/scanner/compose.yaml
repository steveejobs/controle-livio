services:
  antivirus:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:6982509b9e1415bf23cb49d0c55872fdd57fd2b92be33fa26d487da42d322076
    restart: unless-stopped
    environment:
      TMPDIR: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /var/tmp:rw,nosuid,nodev,size=64m,mode=1777
    ulimits:
      core: 0
    volumes:
      - signatures:/var/lib/clamav
    ports:
      - '${SCANNER_BIND_ADDRESS:-127.0.0.1}:${SCANNER_HTTPS_PORT:-443}:443'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  gateway:
    build:
      context: .
    restart: unless-stopped
    network_mode: service:antivirus
    depends_on:
      antivirus:
        condition: service_healthy
    environment:
      SCANNER_TOKEN: ${SCANNER_TOKEN:?Configure a private scanner token of at least 32 characters}
    read_only: true
    ulimits:
      core: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    network_mode: service:antivirus
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      SCANNER_DOMAIN: ${SCANNER_DOMAIN:?Configure the scanner DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    read_only: true
    ulimits:
      core: 0
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

volumes:
  signatures:
  certificates:
  proxy-config:
