name: Quality

on:
  pull_request:
  push:
    branches: [main, 'validation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Loopback placeholders keep unit/build jobs unable to reach shared services.
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/livio_ci?schema=public
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-public-anon-key-placeholder
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-only-public-anon-key-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-placeholder-not-a-credential
      SUPABASE_ENVIRONMENT: test
      SUPABASE_LOCAL: 'true'
      SUPABASE_AUTH_REDIRECT_URL: http://localhost:3000/auth/confirm
      CORS_ORIGINS: http://localhost:3000
      STORAGE_BUCKET: legal-documents

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:validate
      - run: npm run build
      - run: npm run perf:bundle
      - run: npx playwright install --with-deps chromium
      - name: Playwright mocked E2E
        run: npm run test:e2e
        timeout-minutes: 15
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  supabase-isolation:
    # Validation branch runs application tests only; it does not start a local database stack.
    if: ${{ !startsWith(github.ref, 'refs/heads/validation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - name: Test RLS and Storage isolation
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" npm run test:supabase
