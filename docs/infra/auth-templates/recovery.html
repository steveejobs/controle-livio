<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><title>Recuperação de acesso ao Lívio Jurídico</title>
  <body>
    <h1>Lívio Jurídico</h1>
    <p>Recebemos uma solicitação de alteração de senha.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password"
        >Definir nova senha</a
      >
    </p>
    <p>
      Este link é pessoal, temporário e de uso único. Se não solicitou a alteração, ignore esta
      mensagem.
    </p>
  </body>
</html>
